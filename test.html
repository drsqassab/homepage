<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Sarmad Qassab</title>
    <link rel="icon" href="assests/logo.svg">
    <link rel="stylesheet" href="custom.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="d-flex flex-column w-100 min-vh-100 align-items-center justify-content-start bg-one-light">
        <div class="d-flex flex-column w-100 align-items-center justify-content-center bg-five-dark">
            <img src="assests/logo.svg" alt="logo">
        </div>
        <div class="d-flex flex-column w-100 p-2 align-items-center justify-content-center bg-four-blue text-one-light">
            <div class="playfair-display-sc-regular fs-1">Dr. Sarmad Qassab</div>
            <div class="montserrat-regular fs-6">AESTHETIC & PLASTIC SURGERY</div>
        </div>
        <div class="d-flex flex-row w-100 pt-2 align-items-center justify-content-center text-one-light">
            <a class="link-light link-underline-opacity-0" href="#">
            <div class="btn-square bg-four-blue m-2">
                <div class="fs-1 m-2"><i class="bi bi-telephone-fill"></i></div>
                <div class="fs-6 m-2">Call</div>
            </div>
            </a>
            <a class="link-light link-underline-opacity-0" href="#">
            <div class="btn-square bg-three-purple m-2">
                <div class="fs-1 m-2"><i class="bi bi-chat-right-dots-fill"></i></div>
                <div class="fs-6 m-2">Message</div>
            </div>
            </a>
        </div>
        <div class="d-flex flex-row w-100 pt-2 align-items-center justify-content-center text-one-light">
            <a class="link-light link-underline-opacity-0" href="#">
            <div class="btn-square bg-two-pink m-2">
                <div class="fs-1 m-2"><i class="bi bi-image-fill"></i></div>
                <div class="fs-6 m-2">Instagram</div>
            </div>
            </a>
            <a class="link-light link-underline-opacity-0" href="#">
            <div class="btn-square bg-five-dark m-2">
                <div class="fs-1 m-2"><i class="bi bi-geo-alt-fill"></i></div>
                <div class="fs-6 m-2">Location</div>
            </div>
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
